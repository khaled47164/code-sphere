<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - Code Sphere | عالم البرمجة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <a href="index.html" class="inline-block text-2xl font-extrabold bg-gradient-to-l from-indigo-400 to-emerald-400 bg-clip-text text-transparent">
        Code Sphere
      </a>
      <p class="text-xs text-slate-400 mt-1 font-bold">عالم البرمجة — بوابة الطلاب والإدارة</p>
    </div>

    <!-- أزرار التبديل -->
    <div class="flex border-b border-slate-700 mb-6">
      <button id="tab-login" onclick="switchTab('login')" class="w-1/2 py-2.5 text-center font-bold border-b-2 border-indigo-500 text-indigo-400 transition">
        تسجيل الدخول
      </button>
      <button id="tab-signup" onclick="switchTab('signup')" class="w-1/2 py-2.5 text-center font-bold border-b-2 border-transparent text-slate-400 hover:text-white transition">
        حساب جديد
      </button>
    </div>

    <!-- فورم تسجيل الدخول -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-300 mb-1">البريد الإلكتروني</label>
        <input type="email" id="login-email" required placeholder="example@gmail.com"
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-left" dir="ltr" />
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1">كلمة المرور</label>
        <input type="password" id="login-password" required placeholder="••••••••"
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-left" dir="ltr" />
      </div>
      <button type="submit" id="login-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded-xl font-bold transition shadow-lg">
        دخول
      </button>
    </form>

    <!-- فورم إنشاء حساب جديد -->
    <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-sm text-slate-300 mb-1">الاسم بالكامل</label>
        <input type="text" id="signup-name" required placeholder="اكتب اسمك الثلاثي"
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500" />
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1">رقم الهاتف (واتساب)</label>
        <input type="tel" id="signup-phone" required pattern="^01[0125][0-9]{8}$" title="أدخل رقم هاتف مصري صحيح مكون من 11 رقم" placeholder="01012345678"
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 font-mono text-left" dir="ltr" />
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1">البريد الإلكتروني</label>
        <input type="email" id="signup-email" required placeholder="student@gmail.com"
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-left" dir="ltr" />
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1">كلمة المرور</label>
        <input type="password" id="signup-password" required minlength="6" placeholder="6 أحرف على الأقل"
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-left" dir="ltr" />
      </div>
      <button type="submit" id="signup-btn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 rounded-xl font-bold transition shadow-lg">
        إنشاء الحساب
      </button>
    </form>

    <div class="mt-6 text-center border-t border-slate-700 pt-4">
      <a href="index.html" class="text-xs text-slate-400 hover:text-indigo-400 transition">← العودة للصفحة الرئيسية</a>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        tabLogin.classList.add('border-indigo-500', 'text-indigo-400');
        tabLogin.classList.remove('border-transparent', 'text-slate-400');
        tabSignup.classList.remove('border-indigo-500', 'text-indigo-400');
        tabSignup.classList.add('border-transparent', 'text-slate-400');
      } else {
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        tabSignup.classList.add('border-indigo-500', 'text-indigo-400');
        tabSignup.classList.remove('border-transparent', 'text-slate-400');
        tabLogin.classList.remove('border-indigo-500', 'text-indigo-400');
        tabLogin.classList.add('border-transparent', 'text-slate-400');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      btn.disabled = true;
      btn.textContent = 'جاري الدخول...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert('خطأ في تسجيل الدخول: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'دخول';
        return;
      }

      // فحص نوع الحساب (أدمن ولا طالب)
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', data.user.id)
        .single();

      if (profile && profile.role === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'index.html';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('signup-btn');
      const fullName = document.getElementById('signup-name').value.trim();
      const phone = document.getElementById('signup-phone').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;

      btn.disabled = true;
      btn.textContent = 'جاري إنشاء الحساب...';

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { full_name: fullName, phone: phone }
        }
      });

      if (error) {
        alert('خطأ في إنشاء الحساب: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'إنشاء الحساب';
        return;
      }

      if (data.user) {
        await supabaseClient.from('profiles').upsert({
          id: data.user.id,
          full_name: fullName,
          phone: phone,
          role: 'student'
        });
      }

      alert('تم إنشاء الحساب بنجاح! سجل دخولك الآن في Code Sphere.');
      btn.disabled = false;
      btn.textContent = 'إنشاء الحساب';
      switchTab('login');
    }
  </script>
</body>
</html>
